<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#250d0a" />
  <meta name="description" content="저택의 초대장 · 방문 예약" />
  <title>Pumping Ghost Love You — Invitation</title>
  <link rel="preload" href="manor.webp" as="image" />
  <link rel="stylesheet" href="style.css?v=7" />
  <script src="config.js?v=4" defer></script>
  <script src="app.js?v=7" defer></script>
</head>
<body>
  <main id="app" class="app">
    <div class="step-counter" aria-live="polite"><span id="stepNumber">01</span><span class="counter-divider"> / </span>07</div>

    <!-- STEP 1: 시작 -->
    <section class="screen active intro-screen" data-screen="1" aria-label="저택 초대장 시작">
      <div class="start-content">
        <img class="manor-image" src="manor.webp" alt="붉은 배경 위에 그려진 오래된 저택" />
        <div class="entry-area">
          <div class="entry-flourish" aria-hidden="true"><span></span><b>✥</b><span></span></div>
          <button type="button" class="entry-button" id="enterButton">
            <span class="entry-glyph" aria-hidden="true">❧</span>
            <span class="entry-copy"><small>YOU ARE CORDIALLY INVITED</small><strong>저택에 방문하기</strong></span>
            <span class="entry-glyph" aria-hidden="true">❧</span>
          </button>
          <div class="small-hint">✧ 초대장을 열려면 위 문양을 누르세요 ✧</div>
        </div>
      </div>
    </section>

    <!-- STEP 2: 초대장 -->
    <section class="screen" data-screen="2" aria-labelledby="inviteHeading" hidden>
      <div class="screen-scroll invitation-bg">
        <div class="invitation-wrap">
          <form id="guestForm" class="guest-form" novalidate>
            <div class="invitation-art-wrap">
              <img src="invitation.webp" class="invitation-art" alt="붉은 초대장, 흰 가면, 이름을 적을 수 있는 분홍 리본. 당신을 저택에 초대합니다." />
              <label class="ribbon-name" for="primaryGuestName">
                <span class="sr-only">대표 예약자 이름</span>
                <input type="text" id="primaryGuestName" name="guestName" autocomplete="name" maxlength="32" placeholder="성함을 적어주세요" required />
              </label>
            </div>
            <div class="guest-details">
              <div class="ledger-heading" aria-hidden="true"><span></span> VISITOR REGISTER <span></span></div>
              <p class="ledger-note">리본에 대표 방문자 이름을 적어주세요.<br />동행인이 있다면 아래에 추가할 수 있습니다.</p>
              <div id="extraNameFields" class="name-fields"></div>
              <button class="add-guest" id="addGuest" type="button"><span aria-hidden="true">✧</span> 동행인 이름 추가 <small>(최대 4명)</small></button>
              <label class="field phone-field" for="phoneInput">
                <span>연락처 <em>CONTACT NUMBER</em></span>
                <input id="phoneInput" type="tel" name="phone" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="010 - 0000 - 0000" required />
              </label>
              <label class="consent"><input id="privacyConsent" type="checkbox" required /><span><strong>[필수] 개인정보 수집·이용 동의</strong><small>예약 확인과 안내를 위해 이름·전화번호·방문 일정·인원을 수집하며, 행사 종료 후 30일 이내 삭제합니다.</small></span></label>
              <p class="inline-error" id="guestError" role="alert" hidden></p>
              <button type="submit" class="gold-button guest-submit"><span aria-hidden="true">✧</span> 명부를 제출하고 계속하기 <span aria-hidden="true">✧</span></button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- STEP 3: 날짜와 실제 예약 -->
    <section class="screen" data-screen="3" aria-labelledby="bookingHeading" hidden>
      <div class="screen-scroll booking-screen">
        <div class="booking-art-wrap">
          <h1 id="bookingHeading" class="sr-only">어느 날짜에 방문 예정이십니까?</h1>
          <img src="steward.webp" class="steward-art" alt="촛불이 켜진 저택의 지배인. 어느 날짜에 방문 예정이십니까?" />
          <div class="slot-hotspots" id="slotHotspots" role="group" aria-label="방문 날짜 선택 · 왼쪽 체크박스를 눌러 선택하세요">
            <button type="button" data-slot="2026-11-14-14" class="slot-button slot-1" aria-pressed="false"><span class="slot-check" aria-hidden="true"></span><span class="sr-only">11월 14일 오후 2시</span></button>
            <button type="button" data-slot="2026-11-14-19" class="slot-button slot-2" aria-pressed="false"><span class="slot-check" aria-hidden="true"></span><span class="sr-only">11월 14일 오후 7시</span></button>
            <button type="button" data-slot="2026-11-15-14" class="slot-button slot-3" aria-pressed="false"><span class="slot-check" aria-hidden="true"></span><span class="sr-only">11월 15일 오후 2시</span></button>
            <button type="button" data-slot="2026-11-15-19" class="slot-button slot-4" aria-pressed="false"><span class="slot-check" aria-hidden="true"></span><span class="sr-only">11월 15일 오후 7시</span></button>
          </div>
        </div>
        <div class="booking-controls">
          <p id="availabilityMessage" class="availability-note" aria-live="polite">예약 가능 여부를 확인하고 있습니다.</p>
          <p class="check-help">왼쪽 □ 표시를 눌러 방문 시간을 선택하세요.</p>
          <p id="selectionSummary" class="selection-summary">방문 시간을 하나 선택하세요.</p>
          <p id="bookingError" class="inline-error" role="alert" hidden></p>
          <button id="confirmButton" type="button" class="gold-button" disabled>방문 예약 확정</button>
        </div>
      </div>
    </section>

    <!-- STEP 4: 첫 번째 응접실 탐색 -->
    <section class="screen room-screen" data-screen="4" aria-labelledby="roomHeading" hidden>
      <div class="room-header"><h1 id="roomHeading">저택의 응접실</h1><p>책장, 가족사진, 책을 눌러 단서를 확인하세요.</p></div>
      <div class="panorama-viewport" id="roomViewport" tabindex="0" aria-label="전체가 보이는 저택 응접실 이미지">
        <div class="panorama-stage" id="panoramaStage">
          <img src="room.webp" alt="책장, 가족사진, 탁자 위 책이 보이는 저택 응접실" draggable="false" />
          <button class="hotspot hotspot-shelf" type="button" data-item="revolver" data-room="first"><span>책장 살펴보기</span></button>
          <button class="hotspot hotspot-photo" type="button" data-item="family" data-room="first"><span>가족사진 보기</span></button>
          <button class="hotspot hotspot-book" type="button" data-item="book" data-room="first"><span>책 확인하기</span></button>
        </div>
      </div>
      <div class="room-footer"><span id="discoveryText">발견한 단서 <strong id="discoveryCount">0</strong> / 3</span><button type="button" id="nextFromRoom" class="next-button">다음 화면 <span aria-hidden="true">→</span></button></div>
    </section>

    <!-- STEP 5: 잊어버림 -->
    <section class="screen forgotten-screen" data-screen="5" aria-label="무언가 잊어버린 것 같다" hidden>
      <button type="button" id="revealSecondRoom" class="forgotten-button" aria-label="화면을 눌러 다시 응접실로 돌아가기">
        <img src="forgotten.webp" alt="어두운 서재. 무언가 잊어버린 것 같다." />
      </button>
    </section>

    <!-- STEP 6: 두 번째 응접실 탐색 -->
    <section class="screen room-screen second-room-screen" data-screen="6" aria-labelledby="roomHeading2" hidden>
      <div class="room-header"><h1 id="roomHeading2">응접실을 다시 둘러본다</h1><p>익숙하지만 다른 단서들. 네 가지를 다시 확인하세요.</p></div>
      <div class="panorama-viewport" id="roomViewport2" tabindex="0" aria-label="다시 살펴보는 응접실 이미지">
        <div class="panorama-stage panorama-stage-second" id="panoramaStage2">
          <img src="room.webp" alt="책장, 가족사진, 탁자 위 책, 괘종시계가 있는 저택 응접실" draggable="false" />
          <button class="hotspot hotspot-shelf" type="button" data-item="revolver" data-room="second"><span>책장 살펴보기</span></button>
          <button class="hotspot hotspot-photo" type="button" data-item="family" data-room="second"><span>가족사진 보기</span></button>
          <button class="hotspot hotspot-book" type="button" data-item="book" data-room="second"><span>책 확인하기</span></button>
          <button class="hotspot hotspot-clock" type="button" data-item="clock" data-room="second"><span>괘종시계 보기</span></button>
        </div>
      </div>
      <div class="room-footer"><span>발견한 단서 <strong id="discoveryCount2">0</strong> / 4</span><button type="button" id="nextFromSecondRoom" class="next-button">계속하기 <span aria-hidden="true">→</span></button></div>
    </section>

    <!-- STEP 7: 마지막 안내 -->
    <section class="screen note-screen" data-screen="7" aria-label="마지막 방문 안내" hidden>
      <img class="original-final-art" src="final-original.png" alt="방문 안내와 입금 및 확인 안내가 포함된 원본 초대장" />
      <button type="button" class="final-restart" id="restartButton">처음 화면으로 돌아가기</button>
      <p id="noticeConfirmed" class="sr-only" aria-live="polite"></p>
      <p id="finalSummary" class="sr-only" aria-live="polite"></p>
    </section>
  </main>

  <div id="itemModal" class="item-modal" role="dialog" aria-modal="true" aria-labelledby="itemTitle" hidden>
    <button type="button" id="closeItem" class="modal-close" aria-label="닫고 응접실로 돌아가기">×</button>
    <img id="itemImage" src="book.webp" alt="" />
    <h2 id="itemTitle" class="sr-only">단서</h2>
    <button class="outline-button modal-back" type="button" id="itemBack">응접실로 돌아가기</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
